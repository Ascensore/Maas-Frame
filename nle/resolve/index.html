<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Review markers</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 12px; background: #1b1b1b; color: #eee; }
      input { width: 100%; box-sizing: border-box; margin: 4px 0 10px; padding: 6px; }
      button { padding: 8px 12px; }
      .status { margin-top: 12px; font-size: 12px; color: #bbb; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <p>Studio only. Free Resolve: import the EDL from the review page. Delete a review marker and Sync to resolve that comment on the web.</p>
    <label>App URL</label>
    <input id="baseUrl" value="http://localhost:3000" />
    <label>API token</label>
    <input id="token" type="password" />
    <label>Version id</label>
    <input id="versionId" placeholder="clxxxxxxxx" />
    <button id="sync">Sync markers</button>
    <div class="status" id="status"></div>
    <script>
      const { ipcRenderer } = require('electron');
      document.getElementById('sync').addEventListener('click', async () => {
        try {
          const versionId = document.getElementById('versionId').value.trim();
          const storageKey = 'of-synced-markers:' + versionId;
          const previousIds = (() => {
            try {
              const parsed = JSON.parse(localStorage.getItem(storageKey) || '[]');
              return Array.isArray(parsed) ? parsed.filter((id) => typeof id === 'string') : [];
            } catch {
              return [];
            }
          })();
          const result = await ipcRenderer.invoke('sync', {
            baseUrl: document.getElementById('baseUrl').value.trim(),
            token: document.getElementById('token').value.trim(),
            versionId,
            previousIds,
          });
          if (result && Array.isArray(result.syncedIds)) {
            localStorage.setItem(storageKey, JSON.stringify(result.syncedIds));
          }
          document.getElementById('status').textContent = result.message || result;
        } catch (error) {
          document.getElementById('status').textContent = error.message;
        }
      });
    </script>
  </body>
</html>
